<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Poro 聊天翻译</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; color:#f5f0e7; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; user-select:none; }
  .gt-wrap { box-sizing:border-box; width:100%; max-height:100%; overflow:hidden; padding:8px 10px; border-radius:13px; display:flex; flex-direction:column; gap:5px;
    background:linear-gradient(145deg,rgba(15,36,49,.90),rgba(24,24,37,.88)); border:1px solid rgba(91,220,217,.42);
    box-shadow:0 10px 28px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.07); }
  .gt-line { min-width:0; }
  .gt-name { display:inline-block; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8fd7e0; font-size:11px; font-weight:700; vertical-align:bottom; }
  .gt-body { display:block; margin-top:1px; font-size:13px; font-weight:700; line-height:1.35; word-break:break-word;
    text-shadow:0 1px 3px rgba(0,0,0,.65); }
  .gt-orig { display:block; margin-top:1px; font-size:10px; line-height:1.3; color:#9db1b7; word-break:break-word; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
</style>
</head>
<body>
  <div class="gt-wrap" id="gtWrap" style="display:none;"></div>
  <script src="js/game-translate.js"></script>
</body>
</html>
